version: "2"

sql:
  - engine: "postgresql"
    queries: "db/queries.sql"
    schema: "db/schema.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
                  - db_type: "pg_catalog.timestamp"
                    go_type: "time.Time"
                  - db_type: "pg_catalog.timestamptz"
                    go_type: "time.Time"
